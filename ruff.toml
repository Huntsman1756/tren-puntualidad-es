target-version = "py311"
line-length = 110
[lint]
select = ["E","F","I","W","B","UP","SIM","RUF","DTZ","BLE"]
ignore = [
  "BLE001",   # excepciones amplias controladas en bordes de servicio
  "DTZ007",   # strptime se envuelve con tzinfo inmediatamente
  "SIM117",
  "E501",     # SQL multilínea
]
[lint.per-file-ignores]
"tests/**" = ["B017","RUF059"]
