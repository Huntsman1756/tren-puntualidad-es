services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-renfe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-renfe}
      POSTGRES_DB: ${POSTGRES_DB:-renfe}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-renfe}"]
      interval: 5s
      timeout: 3s
      retries: 20

  collector:
    build: ./collector
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-renfe}:${POSTGRES_PASSWORD:-renfe}@db:5432/${POSTGRES_DB:-renfe}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-renfe}:${POSTGRES_PASSWORD:-renfe}@db:5432/${POSTGRES_DB:-renfe}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api

  caddy:
    profiles: ["standalone"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
