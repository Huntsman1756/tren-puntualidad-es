name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: renfe
          POSTGRES_PASSWORD: renfe
          POSTGRES_DB: renfe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U renfe -d renfe_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # BD aislada: los tests de integración de BD (dbfix) la usan;
      # los que necesitan una API levantada se saltan solos.
      TEST_DATABASE_URL: postgresql+psycopg://renfe:renfe@localhost:5432/renfe_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check collector api tests
      - run: pytest tests -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8  # v4.0.2
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - run: docker compose build collector api web

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc  # v2.3.8
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
