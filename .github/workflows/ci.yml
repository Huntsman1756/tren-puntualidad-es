name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: renfe
          POSTGRES_PASSWORD: renfe
          POSTGRES_DB: renfe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U renfe -d renfe_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://renfe:renfe@localhost:5432/renfe_test
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b3590ac225c90a8b5c  # v5.3.0
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check collector api tests
      # suite completa: los tests de integración usan el postgres del job;
      # los que necesitan la API levantada se saltan solos si no está
      - run: pytest tests -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v4.2.2
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507503  # v4.0.2
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v4.2.2
      - run: docker compose build collector api web

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v4.2.2
      - uses: gitleaks/gitleaks-action@ff981213f9e7eeab28142ad619a785a3ab7ed47d  # v2.3.8
