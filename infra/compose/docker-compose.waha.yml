# WAHA (WhatsApp no oficial) — archivo SEPARADO a propósito.
#
# Solo se evalúa si se incluye explícitamente con -f. Así la exigencia
# `WAHA_API_KEY:?` no puede romper el parse del stack principal
# (docker-compose.prod.yml se interpola entero aunque el servicio no se
# levante) y es IMPOSIBLE arrancar WAHA sin una clave real.
#
#   sudo docker compose -p trenes \
#     -f docker-compose.yml \
#     -f infra/compose/docker-compose.prod.yml \
#     -f infra/compose/docker-compose.waha.yml \
#     --profile waha up -d waha
#
# Sin puertos publicados ni labels de Traefik: el collector llega por
# http://waha:3000 dentro de la red del proyecto. Cuenta de PRUEBAS
# siempre, nunca la personal. Ver docs/whatsapp-waha.md.
services:
  waha:
    profiles: ["waha"]
    # Imagen fijada por tag+digest (verificado en Docker Hub 2026-10-09):
    # los tags de WAHA son por motor (gows|noweb|chrome|latest), no hay
    # tag plano de versión. gows cuadra con WHATSAPP_DEFAULT_ENGINE=GOWS.
    image: devlikeapro/waha:${WAHA_IMAGE:-gows-2026.9.2@sha256:1ae3c6a994ee97e5039bf41103193d7bf9175f1a31db73ba89bdeed6277901bc}
    restart: unless-stopped
    environment:
      # Motor por defecto GOWS; si falla la lectura de canales, probar WEBJS.
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_API_KEY: "${WAHA_API_KEY:?WAHA_API_KEY requerido - genera una clave aleatoria larga antes de levantar el perfil waha}"
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
    volumes:
      - waha_sessions:/app/.sessions
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

volumes:
  waha_sessions:
