# Despliegue en VPS con Coolify/Traefik existente.
# Traefik ya publica :80/:443; nosotros solo etiquetamos el servicio web.
#
# USAR SIEMPRE el script de despliegue (fija el proyecto "trenes" y hace
# backup + checks):    sudo bash scripts/deploy.sh
#
# Si se lanza a mano, ES OBLIGATORIO -p trenes (sin él crea un segundo
# stack y una segunda base de datos vacía — incidente v0.3.1):
#   docker compose -p trenes -f docker-compose.yml \
#     -f infra/compose/docker-compose.prod.yml up -d --build
services:
  db:
    restart: unless-stopped
    networks:
      default:
        aliases: [trenes-db]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - backups:/backups
    deploy:
      resources:
        limits:
          memory: 3G
    # Postgres nunca expone puerto al host.

  collector:
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-renfe}:${POSTGRES_PASSWORD:-renfe}@trenes-db:5432/${POSTGRES_DB:-renfe}
    deploy:
      resources:
        limits:
          memory: 2G

  api:
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-renfe}:${POSTGRES_PASSWORD:-renfe}@trenes-db:5432/${POSTGRES_DB:-renfe}
      ALLOWED_ORIGINS: "https://${DOMAIN}"
      RATE_LIMIT_PER_MIN: "120"
      # Traefik (coolify-proxy, red coolify) añade siempre X-Forwarded-For.
      # El SSR de la web llega SIN XFF por la red coolify (alias trenes-api,
      # verificado: 10.0.1.12) o la del proyecto: exento del límite.
      TRUSTED_PROXIES: "10.0.1.0/24,fd2f:970c:9250::/64"
      INTERNAL_NETWORKS: "10.0.1.0/24,fd2f:970c:9250::/64,10.0.5.0/24,127.0.0.1/32"
    networks:
      default:
        aliases: [trenes-api]
      coolify:
        aliases: [trenes-api]
    labels:
      traefik.enable: "true"
      traefik.docker.network: "coolify"
      traefik.http.routers.trenes-api.rule: "Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      traefik.http.routers.trenes-api.entrypoints: "https"
      traefik.http.routers.trenes-api.tls.certresolver: "letsencrypt"
      traefik.http.routers.trenes-api.priority: "100"
      traefik.http.services.trenes-api.loadbalancer.server.port: "8000"
    deploy:
      resources:
        limits:
          memory: 1G

  web:
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://trenes-api:8000
    networks:
      - default
      - coolify
    labels:
      traefik.enable: "true"
      traefik.docker.network: "coolify"
      # HTTPS
      traefik.http.routers.trenes-web.rule: "Host(`${DOMAIN}`)"
      traefik.http.routers.trenes-web.entrypoints: "https"
      traefik.http.routers.trenes-web.tls.certresolver: "letsencrypt"
      traefik.http.services.trenes-web.loadbalancer.server.port: "4321"
      # redirección http -> https
      traefik.http.routers.trenes-web-http.rule: "Host(`${DOMAIN}`)"
      traefik.http.routers.trenes-web-http.entrypoints: "http"
      traefik.http.routers.trenes-web-http.middlewares: "trenes-https"
      traefik.http.middlewares.trenes-https.redirectscheme.scheme: "https"
      # cabeceras de seguridad
      traefik.http.routers.trenes-web.middlewares: "trenes-sec"
      traefik.http.middlewares.trenes-sec.headers.stsSeconds: "31536000"
      traefik.http.middlewares.trenes-sec.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.trenes-sec.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.trenes-sec.headers.frameDeny: "true"
      traefik.http.middlewares.trenes-sec.headers.referrerPolicy: "strict-origin-when-cross-origin"
    deploy:
      resources:
        limits:
          memory: 1G

  # Backup diario de Postgres (03:30 Madrid). La lógica vive en scripts/backup_loop.sh
  # (volcado -Fc verificado, reintentos, rotación). Ruta relativa resuelta contra el
  # directorio del proyecto (raíz del repo, primer -f de deploy.sh).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - backups:/backups
      - ./scripts/backup_loop.sh:/backup_loop.sh:ro
    environment:
      TZ: Europe/Madrid
      PGHOST: trenes-db
      PGUSER: ${POSTGRES_USER:-renfe}
      PGPASSWORD: ${POSTGRES_PASSWORD:-renfe}
      PGDATABASE: ${POSTGRES_DB:-renfe}
    command: ["sh", "/backup_loop.sh"]

  # EXPERIMENTAL: avisos oficiales de WhatsApp Channels vía WAHA (no oficial).
  # Solo se levanta con --profile waha (deploy.sh no lo arranca). Usar SIEMPRE
  # una cuenta de WhatsApp de pruebas, nunca la personal. Ver docs/whatsapp-waha.md.
  # Sin puertos publicados ni labels de Traefik: el collector llega por http://waha:3000.
  waha:
    profiles: ["waha"]
    # Versión fijada (no latest): el último tag verificado con el piloto.
    # Cambiar solo tras probar el nuevo tag; ver docs/whatsapp-waha.md.
    image: devlikeapro/waha:${WAHA_IMAGE_TAG:-2026.9.2}
    restart: unless-stopped
    environment:
      # Motor por defecto GOWS; si falla la lectura de canales, probar WEBJS.
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_API_KEY: ${WAHA_API_KEY:?WAHA_API_KEY requerido para el perfil waha}
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
    volumes:
      - waha_sessions:/app/.sessions
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

networks:
  coolify:
    external: true

volumes:
  backups:
  waha_sessions:
